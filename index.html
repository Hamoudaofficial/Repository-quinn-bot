<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030B1A">
<title>Quinn Bot</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase COMPAT (no modules = works everywhere) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
   CSS VARIABLES & RESET
═══════════════════════════════════════════ */
:root{
  --gold:#FFD700; --gold2:#FFA500; --cyan:#00F5FF;
  --green:#00FF88; --red:#FF4757; --purple:#9B59B6; --pink:#FF6B9D;
  --bg0:#030B1A; --bg1:#071122; --bg2:#0C1830;
  --border:rgba(255,255,255,.08); --text:#F0F4FF; --muted:rgba(255,255,255,.45);
  --nav:64px; --hdr:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--text);
  font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}

/* ═══════ ANIMATED BACKGROUND ═══════ */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 75% 55% at 12% 8%,   rgba(0,245,255,.07) 0%,transparent 65%),
    radial-gradient(ellipse 55% 75% at 88% 18%,  rgba(255,215,0,.05)  0%,transparent 65%),
    radial-gradient(ellipse 45% 45% at 50% 50%,  rgba(155,89,182,.04) 0%,transparent 70%),
    radial-gradient(ellipse 38% 58% at 6% 82%,   rgba(0,255,136,.04)  0%,transparent 65%),
    radial-gradient(ellipse 42% 42% at 94% 78%,  rgba(255,107,157,.04)0%,transparent 65%),
    radial-gradient(ellipse 32% 32% at 62% 95%,  rgba(0,245,255,.03)  0%,transparent 65%),
    radial-gradient(ellipse 68% 68% at 50% 50%,  rgba(255,71,87,.02)  0%,transparent 70%);
  animation:bgP 10s ease-in-out infinite alternate}
@keyframes bgP{0%{opacity:.7}100%{opacity:1}}

/* ═══════ APP SHELL ═══════ */
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;opacity:0;transition:opacity .4s}
#app.on{opacity:1}

/* ═══════ HEADER ═══════ */
#hdr{
  height:var(--hdr);flex-shrink:0;
  background:rgba(5,10,25,.93);backdrop-filter:blur(30px) saturate(200%);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 12px;gap:10px;position:relative;z-index:20;
}
#hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.3),rgba(0,245,255,.2),transparent)}
.av{width:38px;height:38px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,215,0,.14),rgba(0,245,255,.08));
  border:2px solid rgba(255,215,0,.35);box-shadow:0 0 11px rgba(255,215,0,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:var(--gold);position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.hi{flex:1;min-width:0}
.hn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{font-size:10px;font-weight:700;margin-top:1px}
.hright{display:flex;align-items:center;gap:7px}
.hpill{display:flex;align-items:center;gap:5px;
  background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);
  border-radius:18px;padding:4px 10px;cursor:pointer}
#hbal{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold)}
.hib{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.05);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;color:var(--muted);position:relative}
#ndot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;
  background:var(--red);box-shadow:0 0 5px var(--red);display:none}

/* ═══════ CONTENT ═══════ */
#ct{flex:1;overflow-y:auto;overflow-x:hidden;
  padding:12px 12px calc(var(--nav) + 16px + env(safe-area-inset-bottom))}
#ct::-webkit-scrollbar{width:2px}
#ct::-webkit-scrollbar-thumb{background:rgba(255,215,0,.12)}

/* ═══════ BOTTOM NAV ═══════ */
#nav{
  height:calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(4,8,20,.94);backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-around;padding-left:2px;padding-right:2px;
  flex-shrink:0;position:relative;z-index:20;
}
#nav::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.2),rgba(0,245,255,.18),transparent)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 1px;border:none;background:transparent;color:var(--muted);
  cursor:pointer;font-family:'Cairo',sans-serif;border-radius:10px;
  transition:all .2s;position:relative}
.nb i{font-size:17px;transition:transform .2s,color .2s;display:block}
.nb span{font-size:7.5px;font-weight:700;white-space:nowrap;transition:color .2s}
.nb.on i{transform:translateY(-3px) scale(1.14);color:var(--gold)}
.nb.on span{color:var(--gold)}
.nb.on::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:16px;height:2.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--cyan));
  box-shadow:0 0 6px rgba(255,215,0,.5)}

/* ═══════ GLASS CARD ═══════ */
.gc{background:rgba(255,255,255,.04);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--border);border-radius:18px;position:relative;overflow:hidden}
.gc::before{content:'';position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.055) 0%,transparent 55%);pointer-events:none}
.gc-gold{background:rgba(255,215,0,.05);border-color:rgba(255,215,0,.14)}

/* ═══════ BUTTONS ═══════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 17px;border-radius:13px;border:none;
  font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .18s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;box-shadow:0 4px 16px rgba(255,215,0,.25)}
.btn-green{background:rgba(0,255,136,.13);border:1px solid rgba(0,255,136,.2);color:var(--green)}
.btn-red{background:rgba(255,71,87,.13);border:1px solid rgba(255,71,87,.2);color:var(--red)}
.btn-cyan{background:rgba(0,245,255,.11);border:1px solid rgba(0,245,255,.18);color:var(--cyan)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text)}
.btn-purple{background:rgba(155,89,182,.14);border:1px solid rgba(155,89,182,.22);color:var(--purple)}
.btn-full{width:100%;justify-content:center}
.btn-sm{padding:5px 11px;font-size:11px;border-radius:9px}
.btn-off{opacity:.4;pointer-events:none}

/* ═══════ INPUT ═══════ */
.inp{width:100%;padding:11px 13px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:var(--text);font-size:14px;font-family:'Cairo',sans-serif;
  outline:none;transition:border .2s}
.inp:focus{border-color:rgba(255,215,0,.4)}
.inp::placeholder{color:var(--muted)}
.inp-err{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ═══════ TOGGLE ═══════ */
.tog{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,.1);
  position:relative;cursor:pointer;transition:.3s;flex-shrink:0}
.tog.on{background:rgba(0,255,136,.44)}
.tog::before{content:'';position:absolute;top:2.5px;left:2.5px;
  width:17px;height:17px;border-radius:50%;background:white;transition:.3s}
.tog.on::before{left:20.5px}

/* ═══════ MODAL ═══════ */
.mbg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;
  padding:0}
.mbg.on{display:flex;animation:fadeIn .2s ease}
.mbox{width:100%;max-width:420px;padding:20px 18px;
  background:rgba(8,14,32,.97);border:1px solid var(--border);
  border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto}
.mbox.center{border-radius:22px;margin:auto;max-height:80dvh}
.mhdr{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.mhdr h3{flex:1;font-size:15px;font-weight:800}
.mcls{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:17px;padding:4px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ═══════ TOAST ═══════ */
#tw{position:fixed;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);z-index:500;
  display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.tst{background:rgba(10,16,36,.97);border:1px solid var(--border);
  backdrop-filter:blur(20px);padding:9px 17px;border-radius:26px;
  font-size:12px;font-weight:700;white-space:nowrap;
  animation:tIn .28s ease;max-width:85vw;text-align:center}
@keyframes tIn{from{transform:translateY(13px);opacity:0}to{transform:translateY(0);opacity:1}}
.ts{border-color:rgba(0,255,136,.24);color:var(--green)}
.te{border-color:rgba(255,71,87,.24);color:var(--red)}
.tw{border-color:rgba(255,215,0,.24);color:var(--gold)}
.ti{border-color:rgba(0,245,255,.18);color:var(--cyan)}

/* ═══════ BOOT ═══════ */
#boot{position:fixed;inset:0;z-index:9999;background:var(--bg0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.blogo{width:88px;height:88px;position:relative}
.br1{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,215,0,.12);
  border-top-color:var(--gold);animation:spin 1.1s linear infinite}
.br2{position:absolute;inset:10px;border-radius:50%;border:2px solid rgba(0,245,255,.1);
  border-bottom-color:var(--cyan);animation:spin 2s linear infinite reverse}
.bc{position:absolute;inset:20px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,215,0,.15),rgba(255,215,0,.03));
  border:1px solid rgba(255,215,0,.2);display:flex;align-items:center;justify-content:center;
  font-size:23px;color:var(--gold)}
.bname{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px}
.bprog{width:130px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.bfill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--cyan));
  border-radius:2px;box-shadow:0 0 7px rgba(255,215,0,.4);transition:width .3s ease}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════ MISC UTILITY ═══════ */
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sc{padding:11px 7px;text-align:center}
.sc i{font-size:18px;display:block;margin-bottom:4px}
.sv{font-size:13px;font-weight:800;font-family:'Orbitron',sans-serif}
.sl{font-size:9px;color:var(--muted);margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stit{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;margin-bottom:10px}
.stit i{color:var(--gold)}
.ebar{height:7px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.efill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .5s ease;box-shadow:0 0 7px rgba(0,245,255,.3)}
.lbar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.lfill{height:100%;border-radius:3px;transition:width 1s ease}
.gold{color:var(--gold)}.cyan{color:var(--cyan)}.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}.small{font-size:11px}.mono{font-family:monospace;letter-spacing:1px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.qbrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.qb{padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:11px;font-weight:700;font-family:'Cairo',sans-serif}
.qb:active{background:rgba(255,215,0,.12)}
.tx-item{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
.tx-item:last-child{border-bottom:none}
.tx-ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tx-in{background:rgba(0,255,136,.09);border:1px solid rgba(0,255,136,.17)}
.tx-out{background:rgba(255,71,87,.09);border:1px solid rgba(255,71,87,.17)}
.empty{text-align:center;padding:24px 14px;color:var(--muted)}
.empty i{font-size:28px;display:block;margin-bottom:7px;opacity:.35}
.empty p{font-size:12px}
.tabn{padding:7px 14px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;font-weight:700;font-family:'Cairo',sans-serif;white-space:nowrap;transition:.18s}
.tabn.on{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.25);color:var(--gold)}
.tabrow{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabrow::-webkit-scrollbar{display:none}

/* ═══════ TAP ORB ═══════ */
.twrap{width:168px;height:168px;position:relative;margin:0 auto 13px}
.tra{position:absolute;inset:-13px;border-radius:50%;border:2px solid rgba(255,215,0,.11);animation:spin 8s linear infinite}
.trb{position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(0,245,255,.12);animation:spin 4s linear infinite reverse}
#torb{
  width:168px;height:168px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 35%,rgba(255,215,0,.22),rgba(255,215,0,.05) 60%,transparent);
  border:2.5px solid rgba(255,215,0,.27);
  box-shadow:0 0 50px rgba(255,215,0,.11),inset 0 0 26px rgba(255,215,0,.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:.12s;position:relative;overflow:hidden;
}
#torb::before{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.09) 0%,transparent 50%)}
#torb.press{transform:scale(.92);box-shadow:0 0 25px rgba(255,215,0,.2)}
#torb i{font-size:54px;filter:drop-shadow(0 4px 11px rgba(255,215,0,.5))}
#torb .pw{font-size:10px;color:rgba(255,215,0,.7);font-weight:700;margin-top:4px}
.tfloat{position:fixed;pointer-events:none;z-index:999;font-family:'Orbitron',sans-serif;
  font-size:15px;font-weight:900;color:var(--gold);text-shadow:0 0 9px rgba(255,215,0,.6);
  animation:floatUp .9s ease forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-70px) scale(.7);opacity:0}}

/* ═══════ GAME SCREEN ═══════ */
#gs{position:fixed;inset:0;z-index:100;background:var(--bg0);display:none;flex-direction:column}
#gs.on{display:flex;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.ghdr{padding:13px 14px;display:flex;align-items:center;gap:11px;
  border-bottom:1px solid var(--border);flex-shrink:0;
  background:rgba(5,10,25,.95);backdrop-filter:blur(20px)}
.gbk{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;color:var(--text)}
.gbody{flex:1;overflow-y:auto;padding:13px}

/* ═══════ GAMES ═══════ */
.gcard{display:flex;align-items:center;gap:11px;padding:12px 13px;margin-bottom:8px}
.gic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid rgba(255,215,0,.11);background:rgba(255,215,0,.07)}
.ginf{flex:1}
.gtt{font-size:13px;font-weight:800;margin-bottom:2px}
.gds{font-size:10px;color:var(--muted)}
.gbdg{font-size:9px;font-weight:700;padding:2px 8px;border-radius:7px;display:inline-block;margin-top:3px;background:rgba(255,71,87,.14);color:var(--red);border:1px solid rgba(255,71,87,.19)}

/* ═══════ PULSE CHECK ═══════ */
.pct{width:158px;height:158px;border-radius:50%;margin:13px auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;border:3px solid;transition:.15s}
.pct-w{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--muted)}
.pct-r{border-color:var(--green);background:rgba(0,255,136,.09);
  box-shadow:0 0 26px rgba(0,255,136,.24);animation:rpls .4s ease infinite alternate}
@keyframes rpls{from{transform:scale(1)}to{transform:scale(1.04)}}
.pct-h{border-color:var(--gold);background:rgba(255,215,0,.09)}
.pct-m{border-color:var(--red);background:rgba(255,71,87,.09)}

/* ═══════ NUMPAD ═══════ */
.npad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.nk{padding:14px 7px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,.06);color:var(--text);font-size:15px;font-weight:800;
  cursor:pointer;font-family:'Cairo',sans-serif;text-align:center}
.nk.del{color:var(--red);border-color:rgba(255,71,87,.2)}
.nk.ok{color:var(--green);border-color:rgba(0,255,136,.2)}

/* ═══════ MINER ═══════ */
.rock{border-radius:50%;cursor:pointer;position:relative;transition:.1s;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.rock:active{transform:scale(.92);filter:brightness(1.4)}
.rhpb{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:64%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.rhpf{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .15s}
.ptcl{position:fixed;width:7px;height:7px;border-radius:50%;background:var(--gold);pointer-events:none;z-index:9999;animation:ptcl .5s ease forwards}
@keyframes ptcl{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

/* ═══════ WHALE ═══════ */
.ocean{width:100%;height:195px;border-radius:16px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,rgba(0,25,55,.6),rgba(0,8,35,.8));
  border:1px solid rgba(0,245,255,.08);margin:7px 0}
.wt{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;animation:whA 2s ease-in-out;user-select:none}
@keyframes whA{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}

/* ═══════ GAMBLE ═══════ */
.die{width:62px;height:62px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:36px;background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.12)}
.die.roll{animation:dr 1s ease infinite}
@keyframes dr{0%,100%{transform:rotate(0)}25%{transform:rotate(90deg)}75%{transform:rotate(270deg)}}

/* ═══════ EXCHANGE ═══════ */
.pricebig{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;color:var(--gold)}

const genId =()=>{ const r=()=>Math.random().toString(36).substr(2,4).toUpperCase(); return `QN-${r()}-${r()}`; };
const genKey=(uid)=>{ const ts=Date.now().toString(36).toUpperCase().slice(-4); const rnd=Math.random().toString(36).substr(2,4).toUpperCase(); const id=String(uid).slice(-4).toUpperCase().padStart(4,'0'); return `QNN-${id}-${ts}-${rnd}`; };

/* ═══ SAVE STRATEGY ════════════════════════ */
const LS='quinn_u2';
function plainState(){
  const k=['uid','name','username','photoUrl','tokens','totalTokens','clicks',
    'energy','maxEnergy','tapPower','level','xp','goldGrams','goldAvgPrice',
    'vaultStaked','vaultLastDeposit','vaultLastClaim','vaultLoyaltyMul',
    'walletId','secureKey','referralCode','referredBy','referrals','transactions',
    'banned','joinDate','lastSeen','notifications'];
  const o={}; k.forEach(k=>{ o[k]=S[k]; }); return o;
}
function saveLocal(){ try{localStorage.setItem(LS,JSON.stringify(plainState()))}catch(_){} }
function loadLocal(){
  try{const r=localStorage.getItem(LS); if(r){const d=JSON.parse(r);Object.assign(S,d);return true;}}catch(_){}
  return false;
}
let _dbTimer=null;
function markDirty(){
  S._dirty=true;
  saveLocal();
  clearTimeout(_dbTimer);
  _dbTimer=setTimeout(pushFB,3000);
  S._batchCount++;
  if(S._batchCount>=20){S._batchCount=0;pushFB();}
}
async function pushFB(){
  if(!S.uid||!S._dirty) return;
  try{
    const d={...plainState(),lastSeen:firebase.firestore.FieldValue.serverTimestamp()};
    await DB.collection('users').doc(S.uid).set(d,{merge:true});
    S._dirty=false;
  }catch(e){console.warn('[FB]',e.message);}
}
setInterval(()=>{if(S._dirty)pushFB();},5*60*1000);
window.addEventListener('visibilitychange',()=>{ if(document.hidden&&S._dirty)pushFB(); });
window.addEventListener('pagehide',()=>{ if(S._dirty)pushFB(); });

/* ═══ FIREBASE LOAD ════════════════════════ */
async function loadFB(uid){
  try{
    const snap=await DB.collection('users').doc(uid).get();
    if(snap.exists){
      const d=snap.data();
      if(d.banned){ showBanned(); return; }
      Object.assign(S,d); S.uid=uid; saveLocal();
    } else {
      S.uid=uid;
      if(!S.walletId)    S.walletId=genId();
      if(!S.secureKey)   S.secureKey=genKey(uid);
      if(!S.referralCode)S.referralCode=genId();
      S.joinDate=Date.now();
      await pushFB();
    }
  }catch(e){ console.warn('[loadFB]',e.message); }
}

    if(!S.walletId)    S.walletId=genId();
    if(!S.secureKey)   S.secureKey=genKey(S.uid);
    if(!S.referralCode)S.referralCode=genId();
    if(!S.joinDate)    S.joinDate=Date.now();

    buildHeader();
    if(curTab==='home') renderTab('home');
  });

  // Gold market init
  initGoldMarket();

  // Start services
  startNotifListener();
  setInterval(energyRegen,1000);
  setInterval(vaultAutoReward,60000);

  // Handle referral / payment return
  const sp=tg?.initDataUnsafe?.start_param||'';

  // Listen for payment invoiceClosed
  if(tg){
    tg.onEvent('invoiceClosed', data=>{
      if(data.status==='paid'){
        T.show('✅ تم الدفع بنجاح! سيُضاف رصيدك خلال ثوان','s',4000);

          loadFB(S.uid).then(()=>{ buildHeader(); if(curTab==='wallet')renderTab('wallet'); });

        T.show('فشل الدفع — حاول مجدداً','e');
      }
    });
  }

  console.log('[Quinn] Ready ✓ uid:',S.uid);
})();

function startGoldListener(){
  if(goldUnsub) goldUnsub();

    const prev=goldPrice; goldPrice=d.price||100;
    goldHist.push(goldPrice); if(goldHist.length>50) goldHist.shift();

    const diff=goldPrice-prev;

  const up=data[data.length-1]>=data[0];
  goldChart=new Chart(cv,{type:'line',data:{labels:data.map((_,i)=>i+1),datasets:[{data,borderColor:up?'#00FF88':'#FF4757',backgroundColor:up?'rgba(0,255,136,.06)':'rgba(255,71,87,.06)',borderWidth:2,pointRadius:0,tension:.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#777',font:{size:9}}}},animation:{duration:200}}});

    },{merge:true});

      priceHistory:firebase.firestore.FieldValue.arrayUnion(newP)

/* ── PULSE CHECK ── */
function gamePulse(cfg){
  const body=$('gbody');
  let rounds=0,total=5,scores=[],phase='wait',tapTime=0;
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:13px;font-size:12px">
      <span>الجولة: <strong id="pcr">1/${total}</strong></span>
      <span>نقاط: <strong id="pcs" class="gold">0</strong></span>
    </div>
    <div class="pct pct-w" id="pct">
      <i class="fas fa-hand-pointer" style="font-size:34px"></i>
      <div style="font-size:11px;font-weight:700;margin-top:7px" id="pcm">استعد...</div>
    </div>
    <div id="pch" style="margin-top:11px;max-height:75px;overflow-y:auto"></div>`;

  const pct=$('pct'),pm=$('pcm');
  pct.addEventListener('click',()=>{
    if(phase==='wait'){
      clearTimeout(_gRef._t); scores.push(-50);
      addH('مبكر!','var(--purple)'); pm.textContent='⚡ مبكر جداً!';
      pct.className='pct pct-m'; setTimeout(next,800);
    } else if(phase==='tap'){
      clearTimeout(_gRef._t2);
      const ms=Date.now()-tapTime;
      const pts=Math.max(0,Math.floor(1000-ms*1.4));
      scores.push(pts); addH(`${ms}ms → ${pts}pts`,pts>400?'var(--green)':'var(--gold)');
      pct.className='pct pct-h'; pm.textContent=`${ms}ms — ${pts}pts`;
      $('pcs').textContent=scores.reduce((a,b)=>a+Math.max(0,b),0);
      phase='done'; setTimeout(next,700);
    }
  });

  function addH(txt,col){const h=$('pch');if(!h)return;const d=document.createElement('div');d.style.cssText=`font-size:10px;padding:2px;color:${col}`;d.textContent=txt;h.prepend(d);}
  function next(){
    if(!_gRef.running) return;
    if(rounds>=total){const t=scores.reduce((a,b)=>a+Math.max(0,b),0);const p=(t/(total*1000))*100;p>=22?gameWin(p,cfg):gameLose(`نقاطك: ${t}`,cfg);return;}
    rounds++;phase='wait';pct.className='pct pct-w';pm.textContent='انتظر...';$('pcr').textContent=`${rounds}/${total}`;
    const dl=1200+Math.random()*2800;
    _gRef._t=setTimeout(()=>{
      if(!_gRef.running||phase!=='wait') return;
      phase='tap';tapTime=Date.now();pct.className='pct pct-r';pm.textContent='اضغط الآن!';
      _gRef._t2=setTimeout(()=>{if(phase==='tap'){scores.push(0);addH('فاتتك!','var(--red)');pct.className='pct pct-m';pm.textContent='💨 فاتتك!';phase='done';setTimeout(next,700);}},700);
    },dl);
  }
  next();
}

/* ── CIPHER BREAK ── */
function gameCipher(cfg){
  const body=$('gbody');
  let round=0,maxR=6,seq=[],inp=[],lives=3;
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:11px;font-size:12px">
      <span>الجولة: <strong id="cbr">1/${maxR}</strong></span>
      <span>حياة: <strong id="cbl" class="red">❤️❤️❤️</strong></span>
    </div>
    <div id="cbsh" style="min-height:88px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:60px;font-weight:900;color:var(--gold)"></div>
    <div id="cbin" style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:34px;margin:9px 0"></div>
    <div id="cbpad" class="npad" style="display:none"></div>`;

  function next(){
    round++;if(round>maxR){gameWin(100,cfg);return;}
    $('cbr').textContent=`${round}/${maxR}`;
    const len=2+round; seq=Array.from({length:len},()=>Math.floor(Math.random()*10)); inp=[];
    renderInp(); showSeq();
  }
  function showSeq(){
    const pad=$('cbpad'),sh=$('cbsh');if(pad)pad.style.display='none';
    sh.innerHTML='<div style="font-size:12px;color:var(--muted)">احفظ!</div>';
    const t=Math.max(350,1100-round*80);let i=0;
    const nxt=()=>{
      if(!_gRef.running) return;
      if(i>=seq.length){setTimeout(()=>startInp(),350);return;}
      sh.innerHTML=`<div style="animation:fadeIn .25s">${seq[i]}</div>`;i++;setTimeout(nxt,t);
    };
    setTimeout(nxt,400);
  }
  function startInp(){
    $('cbsh').innerHTML='<div style="font-size:12px;color:var(--muted)">أدخل التسلسل</div>';
    const pad=$('cbpad'); pad.style.display='grid';
    pad.innerHTML=[1,2,3,4,5,6,7,8,9,0,'✗','✓'].map(n=>`<div class="nk ${n==='✗'?'del':n==='✓'?'ok':''}" data-n="${n}">${n}</div>`).join('');
    pad.querySelectorAll('.nk').forEach(k=>k.addEventListener('click',()=>{
      const n=k.dataset.n;
      if(n==='✗'){inp.pop();renderInp();}
      else if(n==='✓') check();
      else{inp.push(parseInt(n));renderInp();}
    }));
  }
  function renderInp(){
    const el=$('cbin');if(!el)return;
    el.innerHTML=inp.map(n=>`<div style="width:30px;height:30px;border-radius:7px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.2);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold)">${n}</div>`).join('')||'<span class="muted small">—</span>';
  }
  function check(){
    const ok=seq.every((n,i)=>n===inp[i])&&inp.length===seq.length;
    if(ok){$('cbsh').innerHTML='<div style="color:var(--green);font-size:18px">✅ صحيح!</div>';$('cbpad').style.display='none';inp=[];setTimeout(next,800);}
    else{
      lives--;$('cbl').textContent='❤️'.repeat(Math.max(0,lives));
      $('cbsh').innerHTML=`<div style="color:var(--red);font-size:16px">❌ الصواب: ${seq.join('-')}</div>`;
      $('cbpad').style.display='none';inp=[];
      if(lives<=0){gameLose('نفدت حياتك!',cfg);return;}
      setTimeout(next,1000);
    }
  }
  next();
}

/* ── CHART ORACLE ── */
function gameOracle(cfg){
  const body=$('gbody');
  let rounds=0,maxR=8,correct=0,answered=false,oc=null;
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:9px;font-size:12px">
      <span>السؤال: <strong id="coq">1/${maxR}</strong></span>
      <span>صحيح: <strong id="coc" class="gold">0</strong></span>
    </div>
    <div style="height:115px;margin-bottom:9px"><canvas id="occv"></canvas></div>
    <div style="height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:11px">
      <div id="cot" style="height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));border-radius:3px;width:100%;transition:width 5s linear"></div>
    </div>
    <div class="two" style="gap:9px">
      <button class="btn btn-green btn-full" onclick="orAns('up')"><i class="fas fa-arrow-trend-up"></i> ارتفاع</button>
      <button class="btn btn-red btn-full"   onclick="orAns('down')"><i class="fas fa-arrow-trend-down"></i> انخفاض</button>
    </div>
    <div id="cors" style="text-align:center;margin-top:9px;font-size:12px;font-weight:700;min-height:18px"></div>`;

  let prices=[],nextP=0,corrDir='';

  window.orAns=function(dir){
    if(answered) return; answered=true;
    clearTimeout(_gRef._ot);
    document.getElementById('cot').style.transition='none';
    const ok=dir===corrDir;if(ok) correct++;
    $('coc').textContent=correct;
    const rs=$('cors');if(rs) rs.innerHTML=ok?`<span class="green">✅ صحيح!</span>`:`<span class="red">❌ الصواب: ${corrDir==='up'?'ارتفاع':'انخفاض'}</span>`;
    if(oc){oc.data.datasets[0].data=[...prices,nextP];oc.update('none');}
    setTimeout(nxt,1100);
  };

  function nxt(){
    if(!_gRef.running) return;
    if(rounds>=maxR){const p=(correct/maxR)*100;correct>=Math.ceil(maxR*.55)?gameWin(p,cfg):gameLose(`${correct}/${maxR} صحيح`,cfg);return;}
    rounds++;answered=false;$('coq').textContent=`${rounds}/${maxR}`;const rs=$('cors');if(rs)rs.textContent='';
    prices=[100];for(let i=1;i<20;i++) prices.push(+(prices[i-1]+(Math.random()-.5)*7).toFixed(2));
    nextP=+(prices[prices.length-1]+(Math.random()-.5)*10).toFixed(2);
    corrDir=nextP>prices[prices.length-1]?'up':'down';
    const cv=$('occv');if(cv){if(oc){oc.destroy();oc=null;}const up=prices[prices.length-1]>=prices[0];oc=new Chart(cv,{type:'line',data:{labels:prices.map((_,i)=>i+1),datasets:[{data:prices,borderColor:up?'#00FF88':'#FF4757',borderWidth:2,pointRadius:0,tension:.4,fill:true,backgroundColor:up?'rgba(0,255,136,.05)':'rgba(255,71,87,.05)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}},animation:{duration:200}}});}
    const tmr=$('cot');if(tmr){tmr.style.transition='none';tmr.style.width='100%';setTimeout(()=>{tmr.style.transition='width 5s linear';tmr.style.width='0%';},50);}
    _gRef._ot=setTimeout(()=>{if(!answered)window.orAns('__to__');},5100);
  }
  nxt();
}

window.setBet2=function(v){const b=$('gbet');if(b)b.value=v;};

function getGBet(){
  const v=parseInt($('gbet')?.value||'0');
  if(!v||v<10){T.show('الحد الأدنى 10 Quinn','e');return null;}
  if(v>S.tokens){T.show('رصيد غير كافٍ','e');return null;}
  return v;
}
window.startGamble=async function(vsAI=0){
  const bet=getGBet();if(!bet)return;
  S.tokens-=bet;$('hbal').textContent=fmt(S.tokens);markDirty();
  const r=$('gres');if(!r)return;
  r.innerHTML='<div style="text-align:center;padding:12px;color:var(--cyan)"><i class="fas fa-spinner fa-spin"></i> جاري البحث عن منافس...</div>';

  if(vsAI){
    await delay(1100);
    const my=Math.floor(Math.random()*6)+1;
    let ai=Math.floor(Math.random()*6)+1;
    const rtp=_sessionBet>0?_sessionWin/_sessionBet:0;
    if(rtp>0.95&&Math.random()<0.65) ai=Math.min(6,ai+1+Math.floor(Math.random()*2));
    showGRes(my,ai,'Quinn AI',bet,bet*2,r);
  } else {
    const snap=await RTDB.ref('gambling/lobby').once('value');
    const waiting=snap.val();
    if(waiting && waiting.uid!==S.uid){
      await RTDB.ref('gambling/lobby').remove();
      const my=Math.floor(Math.random()*6)+1;
      const op=Math.floor(Math.random()*6)+1;
      showGRes(my,op,waiting.name||'لاعب',bet,bet+(waiting.bet||bet),r);
    } else {
      await RTDB.ref('gambling/lobby').set({uid:S.uid,name:S.name,bet,ts:Date.now()});
      r.innerHTML='<div style="text-align:center;padding:12px;color:var(--cyan)"><i class="fas fa-spinner fa-spin"></i> في انتظار منافس...</div>';
      setTimeout(async()=>{
        const s2=await RTDB.ref('gambling/lobby').once('value');
        if(s2.val()?.uid===S.uid){
          await RTDB.ref('gambling/lobby').remove();
          const my=Math.floor(Math.random()*6)+1;
          const bo=Math.floor(Math.random()*6)+1;
          showGRes(my,bo,'Quinn Bot',bet,bet*2,r);
        }
      },10000);
    }
  }
};

function showGRes(myD,opD,opNam,myBet,pot,el){
  const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  const won=myD>opD,tied=myD===opD;
  if(won){S.tokens+=pot;_sessionWin+=pot-myBet;addTx('gamble_win',pot-myBet);}
  else if(tied){S.tokens+=myBet;}
  else{_sessionBet+=myBet;addTx('gamble_lose',myBet);}
  markDirty();$('hbal').textContent=fmt(S.tokens);
  el.innerHTML=`
    <div class="gc" style="padding:15px;text-align:center">
      <div style="display:flex;align-items:center;justify-content:space-around;margin-bottom:13px">
        <div>
          <div class="small muted">${S.name.substr(0,10)}</div>
          <div class="die" style="margin:7px auto">${faces[myD-1]}</div>
          <div style="font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;color:var(--gold)">${myD}</div>
        </div>
        <div class="small muted">VS</div>
        <div>
          <div class="small muted">${opNam.substr(0,10)}</div>
          <div class="die" style="margin:7px auto">${faces[opD-1]}</div>
          <div style="font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;color:var(--gold)">${opD}</div>
        </div>
      </div>
      <div style="font-size:17px;font-weight:900;${won?'color:var(--green)':tied?'color:var(--gold)':'color:var(--red)'}">

function vaultAutoReward(){
  if(!S.vaultStaked||S.vaultStaked<=0) return;
  const dr=VYIELD*Math.min(1.25,S.vaultLoyaltyMul||1);
  const pms=Date.now()-(S.vaultLastClaim||Date.now());
  if(pms<60000) return;
  const rw=Math.floor(S.vaultStaked*dr*(pms/(24*60*60*1000)));
  if(rw>0){S.tokens+=rw;S.totalTokens+=rw;S.vaultLastClaim=Date.now();addTx('vault_rw',rw);markDirty();$('hbal').textContent=fmt(S.tokens);T.show(`🏦 Vault: +${fmt(rw)} Quinn`,'s');}
}
function execWithdraw(){
  if(!S.vaultStaked||S.vaultStaked<=0){T.show('لا يوجد رصيد مودع','e');return;}
  const isLk=(Date.now()-(S.vaultLastDeposit||Date.now()))<VLOCKMS;
  let a=S.vaultStaked;
  if(isLk){a=Math.floor(a*.9);T.show(`⚠️ عقوبة: تلقيت ${fmt(a)} فقط`,'w');}
  S.tokens+=a;addTx('vault_wd',a);S.vaultStaked=0;S.vaultLastDeposit=0;
  markDirty();$('hbal').textContent=fmt(S.tokens);T.show(`✅ سحب ${fmt(a)} Quinn`,'s');renderTab('vault');
}
function execClaim(){
  if(!S.vaultStaked||S.vaultStaked<=0){T.show('لا يوجد مودع','e');return;}
  const dr=VYIELD*Math.min(1.25,S.vaultLoyaltyMul||1);
  const pms=Date.now()-(S.vaultLastClaim||Date.now());
  const rw=Math.floor(S.vaultStaked*dr*(pms/(24*60*60*1000)));
  if(rw<=0){T.show('لا توجد مكافأة بعد','w');return;}
  S.tokens+=rw;S.totalTokens+=rw;S.vaultLastClaim=Date.now();addTx('vault_rw',rw);
  markDirty();$('hbal').textContent=fmt(S.tokens);T.show(`🎁 حصلت على ${fmt(rw)} Quinn`,'s');renderTab('vault');
}
window.execWithdraw=execWithdraw;
window.execClaim=execClaim;

      <button class="btn btn-gold btn-full" onclick="PM.confirmPass()"><i class="fas fa-check"></i> تأكيد الشراء</button>
      <div id="perr" class="small red" style="text-align:center;margin-top:8px;min-height:15px"></div>`,
    this._selPkg=null;
  },
  _selPkg:null,
  selectPassPkg(id,quinn,lbl){
    this._selPkg={id,quinn,lbl};
    document.querySelectorAll('[id^="ppkg-"]').forEach(el=>el.style.border='2px solid transparent');
    const el=document.getElementById('ppkg-'+id);
    if(el) el.style.border='2px solid rgba(255,215,0,.4)';
    const sel=$('psel');if(sel) sel.textContent=`اخترت: ${fmt(quinn)} Quinn (حزمة ${lbl})`;
  },
  confirmPass(){
    const pass=$('pinp')?.value;
    const err=$('perr');
    if(!this._selPkg){if(err)err.textContent='اختر حزمة أولاً';return;}
    if(pass===PASS_KEY){
      S.tokens+=this._selPkg.quinn; S.totalTokens+=this._selPkg.quinn;
      addTx('pass_buy',this._selPkg.quinn,{pkg:this._selPkg.id});
      markDirty(); $('hbal').textContent=fmt(S.tokens);
      this.close('m-pass'); T.show(`✅ تم إضافة ${fmt(this._selPkg.quinn)} Quinn!`,'s');
      this._selPkg=null;
    } else {
      if(err) err.textContent='كلمة مرور خاطئة ❌';
      const i=$('pinp');if(i){i.value='';i.classList.add('inp-err');setTimeout(()=>i.classList.remove('inp-err'),450);}
    }
  },

  openShop(){
    this.openTgPay();
  },

  // ── GOLD ──────────────────────────────
  calcBuy(){
    const g=parseFloat($('bg-g')?.value)||0;
    const el=$('bg-cost');if(el)el.textContent=`التكلفة: ${fmt(Math.ceil(g*goldPrice))} Quinn`;
  },
  calcSell(){
    const g=parseFloat($('sg-g')?.value)||0;
    const el=$('sg-rev');if(el)el.textContent=`ستحصل: ${fmt(Math.floor(g*goldPrice))} Quinn`;
  },
  async execBuyGold(){
    const g=parseFloat($('bg-g')?.value)||0;
    if(g<=0){T.show('أدخل كمية صحيحة','e');return;}
    const cost=Math.ceil(g*goldPrice);
    if(cost>S.tokens){T.show('رصيد غير كافٍ','e');return;}
    S.tokens-=cost; S.goldGrams+=g;
    S.goldAvgPrice=S.goldGrams>0?((S.goldAvgPrice*(S.goldGrams-g)+goldPrice*g)/S.goldGrams):goldPrice;
    addTx('gold_buy',cost,{grams:g,price:goldPrice}); markDirty();
    await updateGoldMarket(+(goldPrice*1.001).toFixed(4),cost);
    this.close('m-buy-gold'); $('bg-g').value=''; $('hbal').textContent=fmt(S.tokens);
    T.show(`✅ اشتريت ${g.toFixed(4)}g`,'s');
  },
  async execSellGold(){
    const g=parseFloat($('sg-g')?.value)||0;
    if(g<=0){T.show('أدخل كمية صحيحة','e');return;}
    if(g>S.goldGrams){T.show('لا تملك كافية من الذهب','e');return;}
    const rev=Math.floor(g*goldPrice);
    S.goldGrams-=g; S.tokens+=rev;
    addTx('gold_sell',rev,{grams:g,price:goldPrice}); markDirty();
    await updateGoldMarket(+(goldPrice*.999).toFixed(4),-rev);
    this.close('m-sell-gold'); $('sg-g').value=''; $('hbal').textContent=fmt(S.tokens);
    T.show(`✅ بعت ${g.toFixed(4)}g مقابل ${fmt(rev)} Quinn`,'s');
  },

  // ── SEND ──────────────────────────────
  async execSend(){
    const to=$('s-to')?.value?.trim();
    const amt=parseInt($('s-amt')?.value||'0');
    if(!to||!to.startsWith('QN-')){T.show('معرف غير صحيح','e');return;}
    if(!amt||amt<1){T.show('أدخل كمية صحيحة','e');return;}
    if(amt>S.tokens){T.show('رصيد غير كافٍ','e');return;}
    S.tokens-=amt; addTx('send',amt,{to}); markDirty();
    try{
      const snap=await DB.collection('users').where('walletId','==',to).limit(1).get();
      if(!snap.empty) await snap.docs[0].ref.update({tokens:firebase.firestore.FieldValue.increment(amt),totalTokens:firebase.firestore.FieldValue.increment(amt)});
    }catch(_){}
    this.close('m-send'); $('hbal').textContent=fmt(S.tokens); T.show(`✅ أُرسل ${fmt(amt)} Quinn`,'s');
    if(curTab==='wallet') renderTab('wallet');
  },

  // ── VAULT DEPOSIT ─────────────────────
  execDeposit(){
    const amt=parseInt($('vd-a')?.value||'0');
    if(!amt||amt<1000){T.show('الحد الأدنى 1000 Quinn','e');return;}
    if(amt>S.tokens){T.show('رصيد غير كافٍ','e');return;}
    S.tokens-=amt; S.vaultStaked=(S.vaultStaked||0)+amt;
    S.vaultLastDeposit=Date.now(); if(!S.vaultLastClaim)S.vaultLastClaim=Date.now();
    addTx('vault_dep',amt); markDirty();
    this.close('m-vd'); $('hbal').textContent=fmt(S.tokens);
    T.show(`✅ تم إيداع ${fmt(amt)} Quinn في Vault`,'s'); renderTab('vault');
  },

  // ── PROFILE MODAL ─────────────────────
  openProfile(){
    const rk=getRank(S.totalTokens);
    $('m-profile-body').innerHTML=`
      <div style="text-align:center;padding:7px 0 15px">
        <div style="width:64px;height:64px;border-radius:50%;background:${rk.col}1a;border:3px solid ${rk.col};display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;margin:0 auto 11px">${S.name.charAt(0)}</div>
        <div style="font-size:19px;font-weight:800;margin-bottom:4px">${S.name}</div>
        <div style="font-size:12px;font-weight:700;color:${rk.col};margin-bottom:13px"><i class="fas ${rk.ic}"></i> ${rk.name}</div>
        <div style="font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;color:var(--gold);margin-bottom:3px">${fmt(S.totalTokens)}</div>
        <div class="small muted">Quinn إجمالي</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:15px">
          <div style="padding:9px;background:rgba(255,255,255,.04);border-radius:11px"><div style="font-size:14px;font-weight:800">${fmt(S.clicks)}</div><div class="small muted">نقرات</div></div>
          <div style="padding:9px;background:rgba(255,255,255,.04);border-radius:11px"><div style="font-size:14px;font-weight:800">${S.referrals}</div><div class="small muted">إحالات</div></div>
          <div style="padding:9px;background:rgba(255,255,255,.04);border-radius:11px"><div style="font-size:14px;font-weight:800">${S.level}</div><div class="small muted">مستوى</div></div>
        </div>
      </div>`;
    this.open('m-profile');
  },

  copyWallet(){ navigator.clipboard?.writeText(S.walletId||''); T.show('✅ تم نسخ معرف المحفظة','s'); },
  shareInvite(){
    const link=`${BOT}?start=ref_${S.uid}`;
    if(window.Telegram?.WebApp) window.Telegram.WebApp.openTelegramLink(link);
    else navigator.clipboard?.writeText(link);
    T.show('تم نسخ رابط الدعوة!','s');
  },
  toggleNotif(){ T.show(_notifs.length?`🔔 ${_notifs[0]?.msg||''}`:' لا إشعارات','i'); $('ndot').style.display='none'; },
};
window.PM=PM;

/* ═══ NOTIFICATIONS ════════════════════════ */
function startNotifListener(){
  try{
    DB.collection('notifications').orderBy('timestamp','desc').limit(5).onSnapshot(snap=>{
      let first=true;
      snap.docChanges().forEach(ch=>{
        if(ch.type==='added'){
          const d=ch.doc.data();
          _notifs.unshift({msg:d.message,time:d.timestamp?.toDate?.()?.toLocaleString?.('ar-SA')||'الآن'});
          if(!first){T.show(`🔔 ${d.message}`,'i');$('ndot').style.display='block';}
          first=false;
        }
      });
    });
  }catch(_){}
}

/* ═══ REFERRAL ═════════════════════════════ */
async function handleReferral(refId){
  if(S.referredBy||String(S.uid)===String(refId)) return;
  try{
    S.referredBy=refId; S.tokens+=1000; S.totalTokens+=1000;
    addTx('referral',1000,{from:refId}); markDirty();
    await DB.collection('users').doc(String(refId)).update({
      referrals:firebase.firestore.FieldValue.increment(1),
      tokens:firebase.firestore.FieldValue.increment(5000),
      totalTokens:firebase.firestore.FieldValue.increment(5000),
    });
    T.show('🎁 حصلت على 1000 Quinn كمكافأة إحالة!','s');
  }catch(e){ console.warn('[Ref]',e.message); }
}
