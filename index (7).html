<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030B1A">
<title>Quinn Bot</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase Compat SDK (NOT ES modules - works everywhere) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
/* ═══════ ROOT ═══════ */
:root {
  --gold:#FFD700; --gold2:#FFA500; --cyan:#00F5FF;
  --green:#00FF88; --red:#FF4757; --purple:#9B59B6; --pink:#FF6B9D;
  --bg0:#030B1A; --bg1:#071122; --bg2:#0C1830;
  --glass:rgba(255,255,255,0.05); --border:rgba(255,255,255,0.08);
  --text:#F0F4FF; --muted:rgba(255,255,255,0.45);
  --nav:68px; --hdr:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--text);font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}

/* ═══════ ANIMATED BG ═══════ */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 10% 5%,   rgba(0,245,255,.07) 0%,transparent 65%),
    radial-gradient(ellipse 60% 80% at 90% 15%,  rgba(255,215,0,.05) 0%,transparent 65%),
    radial-gradient(ellipse 50% 50% at 50% 50%,  rgba(155,89,182,.04) 0%,transparent 70%),
    radial-gradient(ellipse 40% 60% at 5% 85%,   rgba(0,255,136,.04) 0%,transparent 65%),
    radial-gradient(ellipse 45% 45% at 95% 80%,  rgba(255,107,157,.04) 0%,transparent 65%),
    radial-gradient(ellipse 35% 35% at 60% 95%,  rgba(0,245,255,.03) 0%,transparent 65%),
    radial-gradient(ellipse 70% 70% at 50% 50%,  rgba(255,71,87,.02) 0%,transparent 70%);
  animation:bgPulse 10s ease-in-out infinite alternate;
}
@keyframes bgPulse{0%{opacity:.7}100%{opacity:1}}

/* ═══════ SHELL ═══════ */
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;opacity:0;transition:opacity .4s}
#app.show{opacity:1}

/* ═══════ HEADER ═══════ */
#hdr{
  height:var(--hdr);flex-shrink:0;
  background:rgba(5,10,25,.92);
  backdrop-filter:blur(30px) saturate(200%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:10px;
  position:relative;z-index:20;
}
#hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,0,.3),rgba(0,245,255,.2),transparent)}
.hdr-av{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(0,245,255,.08));
  border:2px solid rgba(255,215,0,.35);
  box-shadow:0 0 12px rgba(255,215,0,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:var(--gold);
  position:relative;overflow:hidden;
}
.hdr-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-rank{font-size:10px;font-weight:700;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:7px}
.hdr-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);
  border-radius:18px;padding:4px 10px;cursor:pointer;
}
#hdr-bal{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold)}
.hdr-icon-btn{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;color:var(--muted);
  position:relative;
}
#notif-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 5px var(--red);display:none}

/* ═══════ CONTENT ═══════ */
#content{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:12px 12px calc(var(--nav) + 16px + env(safe-area-inset-bottom));
}
#content::-webkit-scrollbar{width:2px}
#content::-webkit-scrollbar-thumb{background:rgba(255,215,0,.12)}

/* ═══════ NAV ═══════ */
#nav{
  height:calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(4,8,20,.93);
  backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding-left:4px;padding-right:4px;
  flex-shrink:0;position:relative;z-index:20;
}
#nav::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,215,0,.2),rgba(0,245,255,.18),transparent)}
.nb{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px;border:none;background:transparent;
  color:var(--muted);cursor:pointer;font-family:'Cairo',sans-serif;
  border-radius:10px;transition:all .22s;position:relative;
}
.nb i{font-size:18px;transition:transform .22s,color .22s;display:block}
.nb span{font-size:8px;font-weight:700;white-space:nowrap;transition:color .22s}
.nb.on i{transform:translateY(-3px) scale(1.15);color:var(--gold)}
.nb.on span{color:var(--gold)}
.nb.on::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:18px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--cyan));box-shadow:0 0 6px rgba(255,215,0,.5)}

/* ═══════ GLASS CARD ═══════ */
.gc{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--border);border-radius:20px;
  position:relative;overflow:hidden;
}
.gc::before{content:'';position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.055) 0%,transparent 55%);pointer-events:none}
.gc-gold{background:rgba(255,215,0,.05);border-color:rgba(255,215,0,.14)}

/* ═══════ BUTTONS ═══════ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:14px;border:none;
  font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .18s;white-space:nowrap;
}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;box-shadow:0 4px 18px rgba(255,215,0,.25)}
.btn-green{background:rgba(0,255,136,.14);border:1px solid rgba(0,255,136,.22);color:var(--green)}
.btn-red{background:rgba(255,71,87,.14);border:1px solid rgba(255,71,87,.22);color:var(--red)}
.btn-cyan{background:rgba(0,245,255,.12);border:1px solid rgba(0,245,255,.2);color:var(--cyan)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text)}
.btn-full{width:100%;justify-content:center}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:9px}
.btn-disabled{opacity:.4;pointer-events:none}

/* ═══════ INPUT ═══════ */
.inp{
  width:100%;padding:11px 14px;border-radius:13px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:var(--text);font-size:14px;font-family:'Cairo',sans-serif;outline:none;
  transition:border .2s;
}
.inp:focus{border-color:rgba(255,215,0,.4)}
.inp::placeholder{color:var(--muted)}
.inp-shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ═══════ TOGGLE ═══════ */
.tog{width:42px;height:23px;border-radius:12px;background:rgba(255,255,255,.1);position:relative;cursor:pointer;transition:.3s;flex-shrink:0}
.tog.on{background:rgba(0,255,136,.45)}
.tog::before{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:white;transition:.3s}
.tog.on::before{left:21.5px}

/* ═══════ SECTIONS ═══════ */
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:12px}
.sec-title i{color:var(--gold)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:4px}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.mb12{margin-bottom:12px}
.gold{color:var(--gold)}
.cyan{color:var(--cyan)}
.green{color:var(--green)}
.red{color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:11px}
.mono{font-family:monospace;letter-spacing:1px}

/* ═══════ ENERGY BAR ═══════ */
.ebar{height:7px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.efill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .5s ease;box-shadow:0 0 7px rgba(0,245,255,.3)}

/* ═══════ LEVEL BAR ═══════ */
.lbar{height:7px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;margin-top:6px}
.lfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width 1s ease}

/* ═══════ TAP ORB ═══════ */
.tap-wrap{width:170px;height:170px;position:relative;margin:0 auto 14px}
.tap-ring-a{position:absolute;inset:-13px;border-radius:50%;border:2px solid rgba(255,215,0,.12);animation:rot 8s linear infinite}
.tap-ring-b{position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(0,245,255,.13);animation:rot 4s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.tap-orb{
  width:170px;height:170px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 35%,rgba(255,215,0,.22),rgba(255,215,0,.05) 60%,transparent);
  border:2.5px solid rgba(255,215,0,.28);
  box-shadow:0 0 50px rgba(255,215,0,.12),inset 0 0 28px rgba(255,215,0,.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:.12s;position:relative;overflow:hidden;
}
.tap-orb::before{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,transparent 50%)}
.tap-orb.press{transform:scale(.92);box-shadow:0 0 25px rgba(255,215,0,.2)}
.tap-orb i{font-size:56px;filter:drop-shadow(0 4px 12px rgba(255,215,0,.5))}
.tap-orb .pow{font-size:10px;color:rgba(255,215,0,.7);font-weight:700;margin-top:4px}
.tap-float{position:fixed;pointer-events:none;z-index:999;font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--gold);text-shadow:0 0 10px rgba(255,215,0,.6);animation:floatUp .9s ease forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-72px) scale(.7);opacity:0}}

/* ═══════ STATS GRID ═══════ */
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:13px}
.scard{padding:12px 8px;text-align:center}
.scard i{font-size:19px;display:block;margin-bottom:5px}
.scard .sv{font-size:14px;font-weight:800;font-family:'Orbitron',sans-serif}
.scard .sl{font-size:9px;color:var(--muted);margin-top:2px}

/* ═══════ GAME SCREEN ═══════ */
#game-screen{position:fixed;inset:0;z-index:100;background:var(--bg0);display:none;flex-direction:column;overflow:hidden}
#game-screen.open{display:flex;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.game-hdr{padding:14px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.game-back{width:35px;height:35px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--text)}
.game-body{flex:1;overflow-y:auto;padding:14px}

/* ═══════ MODAL ═══════ */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{width:100%;max-width:360px;padding:20px;background:rgba(8,14,30,.96);border:1px solid var(--border);border-radius:22px}
.modal-box.gold{border-color:rgba(255,215,0,.2)}
.modal-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-hdr h3{flex:1;font-size:16px;font-weight:800}
.modal-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}

/* ═══════ TOAST ═══════ */
#toast-wrap{position:fixed;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(12,18,38,.97);border:1px solid var(--border);backdrop-filter:blur(20px);padding:9px 18px;border-radius:28px;font-size:12px;font-weight:700;white-space:nowrap;animation:toastIn .3s ease;max-width:85vw;text-align:center}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.s{border-color:rgba(0,255,136,.25);color:var(--green)}
.toast.e{border-color:rgba(255,71,87,.25);color:var(--red)}
.toast.w{border-color:rgba(255,215,0,.25);color:var(--gold)}
.toast.i{border-color:rgba(0,245,255,.2);color:var(--cyan)}

/* ═══════ BOOT SCREEN ═══════ */
#boot{position:fixed;inset:0;z-index:9999;background:var(--bg0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.boot-orb{width:90px;height:90px;position:relative}
.boot-r1{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,215,0,.12);border-top-color:var(--gold);animation:rot 1.2s linear infinite}
.boot-r2{position:absolute;inset:10px;border-radius:50%;border:2px solid rgba(0,245,255,.1);border-bottom-color:var(--cyan);animation:rot 2s linear infinite reverse}
.boot-c{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,rgba(255,215,0,.15),rgba(255,215,0,.03));border:1px solid rgba(255,215,0,.2);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold)}
.boot-name{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px}
.boot-prog{width:140px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.boot-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--cyan));border-radius:2px;transition:width .3s ease;box-shadow:0 0 7px rgba(255,215,0,.4)}

/* ═══════ LEADERBOARD ═══════ */
.lb-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;margin-bottom:7px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05)}
.lb-item.me{background:rgba(255,215,0,.06);border-color:rgba(255,215,0,.15)}
.lb-rank{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;width:26px;text-align:center}
.lb-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;flex-shrink:0;border:2px solid}
.lb-info{flex:1}
.lb-name{font-size:12px;font-weight:700}
.lb-sub{font-size:9px;color:var(--muted)}
.lb-bal{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--gold)}

/* ═══════ TX LIST ═══════ */
.tx{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
.tx:last-child{border-bottom:none}
.tx-ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.tx-ic.in{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.18)}
.tx-ic.out{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.18)}
.tx-info{flex:1}
.tx-t{font-size:12px;font-weight:700}
.tx-d{font-size:10px;color:var(--muted);margin-top:1px}
.tx-a{font-size:13px;font-weight:800;font-family:'Orbitron',sans-serif}

/* ═══════ EMPTY STATE ═══════ */
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty i{font-size:30px;display:block;margin-bottom:8px;opacity:.35}
.empty p{font-size:12px}

/* ═══════ TABS ═══════ */
.tab-row{display:flex;gap:7px;margin-bottom:13px;overflow-x:auto;padding-bottom:2px}
.tab-row::-webkit-scrollbar{display:none}
.tabn{padding:7px 15px;border-radius:18px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;font-weight:700;font-family:'Cairo',sans-serif;white-space:nowrap;transition:.18s}
.tabn.on{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.25);color:var(--gold)}

/* ═══════ GAMES ═══════ */
.game-card{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:9px}
.game-ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;border:1px solid rgba(255,215,0,.12);background:rgba(255,215,0,.07)}
.game-info{flex:1}
.game-title{font-size:13px;font-weight:800;margin-bottom:2px}
.game-desc{font-size:10px;color:var(--muted)}
.game-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;display:inline-block;margin-top:3px;background:rgba(255,71,87,.15);color:var(--red);border:1px solid rgba(255,71,87,.2)}

/* ═══════ PULSE CHECK ═══════ */
.pc-target{width:160px;height:160px;border-radius:50%;margin:14px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:3px solid;transition:.15s}
.pc-wait{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--muted)}
.pc-ready{border-color:var(--green);background:rgba(0,255,136,.09);box-shadow:0 0 28px rgba(0,255,136,.25);animation:readyPls .4s ease infinite alternate}
@keyframes readyPls{from{transform:scale(1)}to{transform:scale(1.04)}}
.pc-hit{border-color:var(--gold);background:rgba(255,215,0,.09)}
.pc-miss{border-color:var(--red);background:rgba(255,71,87,.09)}

/* ═══════ CIPHER ═══════ */
.numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.nkey{padding:15px 8px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font-size:16px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;text-align:center}
.nkey.del{color:var(--red);border-color:rgba(255,71,87,.2)}
.nkey.ok{color:var(--green);border-color:rgba(0,255,136,.2)}

/* ═══════ MINER ═══════ */
.rock{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;position:relative;transition:.1s;margin:0 auto}
.rock:active{transform:scale(.93);filter:brightness(1.4)}
.rock-hpb{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:65%;height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.rock-hpf{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .15s}
.ptcl{position:fixed;width:7px;height:7px;border-radius:50%;background:var(--gold);pointer-events:none;z-index:9999;animation:ptcl .55s ease forwards}
@keyframes ptcl{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

function fmt(n){

  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';

/* ══════════════════════════════════════════
   SAVE STRATEGY (6 layers)
══════════════════════════════════════════ */
const LS_KEY = 'quinn_u';

function saveLocal(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(_plain())) }catch(_){}
}
function _plain(){
  const k=['uid','name','username','photoUrl','tokens','totalTokens','clicks',
    'energy','maxEnergy','tapPower','level','xp','goldGrams','goldAvgPrice',
    'vaultStaked','vaultLastDeposit','vaultLastClaim','vaultLoyaltyMul',
    'walletId','referralCode','referredBy','referrals','transactions','banned',
    'joinDate','lastSeen','notifications'];
  const o={};
  k.forEach(k=>{ o[k]=S[k]; });
  return o;
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const d=JSON.parse(raw); Object.assign(S,d); return true; }
  }catch(_){}
  return false;
}

let _debounceTimer=null;
function debounceSave(){
  clearTimeout(_debounceTimer);
  _debounceTimer=setTimeout(()=>saveLocal(),300);
}

async function pushFirebase(force=false){
  if(!S.uid) return;
  if(!S._dirty && !force) return;
  try{
    const d={..._plain(), lastSeen:firebase.firestore.FieldValue.serverTimestamp()};
    await db.collection('users').doc(S.uid).set(d,{merge:true});
    S._dirty=false;
  }catch(e){ console.warn('[FB] save failed',e); }
}

function markDirty(){
  S._dirty=true;
  debounceSave();
  S._batchCount++;
  if(S._batchCount>=20){ S._batchCount=0; pushFirebase(); }
}

// Layer 4: periodic
setInterval(()=>{ if(S._dirty) pushFirebase(); },5*60*1000);

// Layer 5: beforeunload
window.addEventListener('beforeunload',()=>{
  if(S._dirty) pushFirebase();
});

/* ══════════════════════════════════════════
   FIREBASE LOAD
══════════════════════════════════════════ */
async function loadFromFirebase(uid){
  try{
    const snap=await db.collection('users').doc(uid).get();
    if(snap.exists){
      const d=snap.data();
      if(d.banned){ showBanned(); return false; }
      Object.assign(S,d);
      S.uid=uid;
      saveLocal();
    } else {
      // New user
      S.uid=uid;
      if(!S.walletId)  S.walletId=genWalletId();
      if(!S.secureKey) S.secureKey=genSecureKey(uid);
      if(!S.referralCode) S.referralCode=genWalletId();
      S.joinDate=Date.now();
      await pushFirebase(true);
    }
    return true;
  }catch(e){
    console.warn('[FB] load failed:',e);
    return false; // Use cached data
  }
}

    checkLevelUp();
  });

/* Energy */
function energyRegen(){
  if(S.energy<S.maxEnergy){
    S.energy=Math.min(S.maxEnergy,S.energy+1);

}
function updateEnergyUI(){
  const f=$('e-fill'), t=$('e-txt');
  const pct=(S.energy/S.maxEnergy*100).toFixed(1);
  if(f) f.style.width=pct+'%';
  if(t) t.textContent=`${S.energy}/${S.maxEnergy}`;
}

/* Level */
function checkLevelUp(){
  const xpNeeded=1000*Math.pow(1.4,S.level-1);
  if(S.xp>=xpNeeded && S.level<50){
    S.level++;
    S.xp=0;
    S.tapPower=Math.floor(1+S.level*0.5);
    toast(`🎉 ارتقيت للمستوى ${S.level}! النقر ×${S.tapPower}`,'s');
    buildHeader();
  }
}

function startGoldListener(){
  if(goldUnsub) goldUnsub();
  goldUnsub=db.collection('market').doc('global_gold').onSnapshot(snap=>{
    if(!snap.exists) return;
    const d=snap.data();
    const prev=goldPrice;
    goldPrice=d.price||100;
    goldHist.push(goldPrice);
    if(goldHist.length>50) goldHist.shift();

    const el=$('ex-price');
    if(!el) return;
    el.textContent=`$${goldPrice.toFixed(2)}`;
    const diff=goldPrice-prev;
    const pct=prev?(diff/prev*100).toFixed(2):'0.00';
    const chg=$('ex-chg');
    if(chg){ chg.textContent=(diff>=0?'+':'')+pct+'%'; chg.className='chg '+(diff>=0?'up':'dn'); }
    const mg=$('ex-my-gold');if(mg) mg.textContent=S.goldGrams.toFixed(4)+'g';
    const gv=$('ex-gold-val');if(gv) gv.textContent=fmt(S.goldGrams*goldPrice);
    const vol=$('ex-vol');if(vol) vol.textContent=fmt(d.volume||0);
    const upd=$('ex-upd');if(upd) upd.textContent='الآن';
    drawGoldChart();
  });
}

function drawGoldChart(){
  const canvas=$('gold-canvas'); if(!canvas||!window.Chart) return;
  if(goldChart){ goldChart.destroy(); goldChart=null; }
  const data=goldHist.length>1?goldHist:[goldPrice,goldPrice];
  const rising=data[data.length-1]>=data[0];
  goldChart=new Chart(canvas,{
    type:'line',
    data:{
      labels:data.map((_,i)=>i+1),
      datasets:[{data,borderColor:rising?'#00FF88':'#FF4757',
        backgroundColor:rising?'rgba(0,255,136,.06)':'rgba(255,71,87,.06)',
        borderWidth:2,pointRadius:0,tension:.4,fill:true}]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{display:false},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#777',font:{size:9}}}},
      animation:{duration:250}}
  });
}

async function execBuyGold(){
  const g=parseFloat($('buy-g').value)||0;
  if(g<=0){ toast('أدخل كمية صحيحة','e'); return; }
  const cost=Math.ceil(g*goldPrice);
  if(cost>S.tokens){ toast('رصيد غير كافٍ','e'); return; }
  S.tokens-=cost;
  S.goldGrams+=g;
  S.goldAvgPrice=S.goldGrams>0?((S.goldAvgPrice*(S.goldGrams-g)+goldPrice*g)/S.goldGrams):goldPrice;
  addTx('gold_buy',cost,{grams:g,price:goldPrice});
  markDirty();
  // Update global price
  const newP=+(goldPrice*(1.001)).toFixed(4);
  await updateGoldMarket(newP,cost);
  closeModal('buy-modal');
  $('buy-g').value='';
  $('hdr-bal').textContent=fmt(S.tokens);
  toast(`✅ اشتريت ${g.toFixed(4)}g ذهب`,'s');
}

async function execSellGold(){
  const g=parseFloat($('sell-g').value)||0;
  if(g<=0){ toast('أدخل كمية صحيحة','e'); return; }
  if(g>S.goldGrams){ toast('لا تملك كافية من الذهب','e'); return; }
  const rev=Math.floor(g*goldPrice);
  S.goldGrams-=g;
  S.tokens+=rev;
  addTx('gold_sell',rev,{grams:g,price:goldPrice});
  markDirty();
  const newP=+(goldPrice*(0.999)).toFixed(4);
  await updateGoldMarket(newP,-rev);
  closeModal('sell-modal');
  $('sell-g').value='';
  $('hdr-bal').textContent=fmt(S.tokens);
  toast(`✅ بعت ${g.toFixed(4)}g مقابل ${fmt(rev)} Quinn`,'s');
}

async function updateGoldMarket(newPrice,volDelta){
  newPrice=Math.max(5,Math.min(50000,newPrice));
  try{
    await db.collection('market').doc('global_gold').set({
      price:newPrice,
      volume:firebase.firestore.FieldValue.increment(Math.abs(volDelta||0)),
      lastUpdate:firebase.firestore.FieldValue.serverTimestamp(),
    },{merge:true});
    // Add to history
    await db.collection('market').doc('global_gold').update({
      priceHistory:firebase.firestore.FieldValue.arrayUnion(newPrice)
    });
  }catch(e){ console.warn('[Gold]',e); }
}

      <div class="game-ic"><i class="fas ${g.icon}"></i></div>
      <div class="game-info">
        <div class="game-title">${g.title}</div>
        <div class="game-desc">${g.desc}</div>
        <div class="game-badge">مكافأة: ${fmt(g.rmin)}-${fmt(g.rmax)} Quinn</div>
      </div>
      <button class="btn ${cd?'btn-ghost btn-disabled':'btn-gold'} btn-sm" data-game="${g.id}" ${cd?'disabled':''}>
        ${cd?`<i class="fas fa-clock"></i> ${getCDSec(g.id)}ث`:'<i class="fas fa-play"></i> العب'}
      </button>
    </div>`;
  }).join('');

  c.querySelectorAll('[data-game]').forEach(btn=>{
    btn.addEventListener('click',()=>launchGame(btn.dataset.game));
  });
}

/* ══════════════════════════════════════════
   GAMES ENGINE
══════════════════════════════════════════ */
let activeGame=null, gameTimer=null;

function launchGame(id){
  const cfg=GAMES.find(g=>g.id===id);
  if(!cfg||isOnCD(id)) return;
  activeGame={id,cfg};
  $('game-title').textContent=cfg.title;
  $('game-stat').textContent='';
  $('game-screen').classList.add('open');
  document.getElementById('game-back').onclick=()=>closeGameScreen();
  if(id==='pulse')  startPulse(cfg);
  else if(id==='cipher') startCipher(cfg);
  else if(id==='oracle') startOracle(cfg);
  else if(id==='miner')  startMiner(cfg);
  else if(id==='whale')  startWhale(cfg);
}

function closeGameScreen(){
  clearInterval(gameTimer);clearTimeout(activeGame?._t);
  $('game-screen').classList.remove('open');
  $('game-body').innerHTML='';
  activeGame=null;
}

function gameWin(score,cfg){
  clearInterval(gameTimer);
  localStorage.setItem('qcd_'+cfg.id,String(Date.now()));
  const pct=Math.min(100,Math.max(0,score));
  const reward=Math.floor(cfg.rmin+(cfg.rmax-cfg.rmin)*pct/100);
  S.tokens+=reward; S.totalTokens+=reward;
  addTx('tap_reward',reward,{game:cfg.id});
  markDirty();
  $('hdr-bal').textContent=fmt(S.tokens);
  $('game-body').innerHTML=`
    <div style="text-align:center;padding:28px 16px">
      <div style="font-size:60px;animation:bounceIn .5s">🏆</div>
      <div style="font-size:24px;font-weight:900;color:var(--gold);margin:12px 0">فزت!</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">أداء: ${pct.toFixed(0)}%</div>
      <div style="font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;color:var(--gold)">+${fmt(reward)} Quinn</div>
      <button class="btn btn-gold btn-full" style="margin-top:20px" onclick="closeGameScreen()">حسناً 👍</button>
    </div>`;
}
function gameLose(msg,cfg){
  clearInterval(gameTimer);
  localStorage.setItem('qcd_'+cfg.id,String(Date.now()));
  $('game-body').innerHTML=`
    <div style="text-align:center;padding:28px 16px">
      <div style="font-size:60px">💔</div>
      <div style="font-size:22px;font-weight:900;color:var(--red);margin:12px 0">خسرت!</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px">${msg||'حاول مجدداً'}</div>
      <div style="color:var(--muted);font-size:13px">لا مكافأة للخسارة</div>
      <button class="btn btn-ghost btn-full" style="margin-top:20px" onclick="closeGameScreen()">حسناً</button>
    </div>`;
}

/* PULSE CHECK */
function startPulse(cfg){
  const body=$('game-body');
  let rounds=0,totalRounds=5,scores=[],phase='wait',tapTime=0;
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:14px;font-size:12px">
      <span>الجولة: <strong id="pc-r">1/${totalRounds}</strong></span>
      <span>النقاط: <strong id="pc-s" class="gold">0</strong></span>
    </div>
    <div class="pc-target pc-wait" id="pct">
      <i class="fas fa-hand-pointer" style="font-size:36px"></i>
      <div style="font-size:12px;font-weight:700;margin-top:8px" id="pcm">استعد...</div>
    </div>
    <div id="pc-hist" style="margin-top:12px;max-height:80px;overflow-y:auto"></div>`;

  const target=$('pct'),pmsg=$('pcm');
  target.addEventListener('click',onTap);

  function onTap(){
    if(phase==='wait'){
      clearTimeout(activeGame._t);
      scores.push(-50);
      addHist('مبكر!','var(--purple)');
      pmsg.textContent='⚡ مبكر جداً!';
      target.className='pc-target pc-miss';
      setTimeout(nextRound,800);
    } else if(phase==='tap'){
      clearTimeout(activeGame._t2);
      const ms=Date.now()-tapTime;
      const pts=Math.max(0,Math.floor(1000-ms*1.4));
      scores.push(pts);
      addHist(`${ms}ms → ${pts}pts`,pts>400?'var(--green)':'var(--gold)');
      target.className='pc-target pc-hit';
      pmsg.textContent=`${ms}ms — ${pts}pts`;
      $('pc-s').textContent=scores.reduce((a,b)=>a+Math.max(0,b),0);
      phase='done';
      setTimeout(nextRound,700);
    }
  }

  function addHist(txt,clr){
    const h=$('pc-hist');
    if(!h) return;
    const d=document.createElement('div');
    d.style.cssText=`font-size:11px;padding:2px 4px;color:${clr}`;
    d.textContent=txt;
    h.prepend(d);
  }

  function nextRound(){
    if(rounds>=totalRounds){ finish(); return; }
    rounds++;
    phase='wait';
    target.className='pc-target pc-wait';
    pmsg.textContent='انتظر...';
    $('pc-r').textContent=`${rounds}/${totalRounds}`;
    const delay=1200+Math.random()*2800;
    activeGame._t=setTimeout(()=>{
      if(phase!=='wait') return;
      phase='tap'; tapTime=Date.now();
      target.className='pc-target pc-ready';
      pmsg.textContent='اضغط الآن!';
      activeGame._t2=setTimeout(()=>{
        if(phase==='tap'){ scores.push(0); addHist('فاتتك!','var(--red)'); target.className='pc-target pc-miss'; pmsg.textContent='💨 فاتتك!'; phase='done'; setTimeout(nextRound,700); }
      },700);
    },delay);
  }

  function finish(){
    const total=scores.reduce((a,b)=>a+Math.max(0,b),0);
    const pct=(total/(totalRounds*1000))*100;
    if(pct>=25) gameWin(pct,cfg);
    else gameLose(`نقاطك: ${total}`,cfg);
  }

  nextRound();
}

/* CIPHER BREAK */
function startCipher(cfg){
  const body=$('game-body');
  let round=0,maxRounds=6,seq=[],input=[],lives=3;
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:12px">
      <span>الجولة: <strong id="cb-r">1/${maxRounds}</strong></span>
      <span>حياة: <strong id="cb-l" class="red">❤️❤️❤️</strong></span>
    </div>
    <div id="cb-show" style="min-height:90px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:64px;font-weight:900;color:var(--gold)"></div>
    <div id="cb-in" style="display:flex;gap:7px;justify-content:center;flex-wrap:wrap;min-height:36px;margin:10px 0"></div>
    <div id="cb-pad" class="numpad" style="display:none"></div>`;

  function nextRound(){
    round++;
    if(round>maxRounds){ gameWin(100,cfg); return; }
    $('cb-r').textContent=`${round}/${maxRounds}`;
    const len=2+round;
    seq=Array.from({length:len},()=>Math.floor(Math.random()*10));
    input=[];
    renderInput();
    showSeq();
  }

  function showSeq(){
    const pad=$('cb-pad'),inp=$('cb-in');
    if(pad) pad.style.display='none';
    const show=$('cb-show');
    show.innerHTML='<div style="font-size:13px;color:var(--muted)">احفظ!</div>';
    const showTime=Math.max(350,1100-round*80);
    let i=0;
    const next=()=>{
      if(i>=seq.length){ setTimeout(()=>startInput(),350); return; }
      show.innerHTML=`<div style="animation:popIn .25s ease">${seq[i]}</div>`;
      i++;
      setTimeout(next,showTime);
    };
    setTimeout(next,400);
  }

  function startInput(){
    $('cb-show').innerHTML='<div style="font-size:13px;color:var(--muted)">أدخل التسلسل</div>';
    const pad=$('cb-pad');
    pad.style.display='grid';
    pad.innerHTML=[1,2,3,4,5,6,7,8,9,0,'✗','✓'].map(n=>
      `<div class="nkey ${n==='✗'?'del':n==='✓'?'ok':''}" data-n="${n}">${n}</div>`
    ).join('');
    pad.querySelectorAll('.nkey').forEach(k=>k.addEventListener('click',()=>{
      const n=k.dataset.n;
      if(n==='✗'){ input.pop(); renderInput(); }
      else if(n==='✓') check();
      else { input.push(parseInt(n)); renderInput(); }
    }));
  }

  function renderInput(){
    const el=$('cb-in'); if(!el) return;
    el.innerHTML=input.map(n=>
      `<div style="width:32px;height:32px;border-radius:8px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.2);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:700;color:var(--gold)">${n}</div>`
    ).join('')||'<span class="muted small">—</span>';
  }

  function check(){
    const ok=seq.every((n,i)=>n===input[i])&&input.length===seq.length;
    if(ok){
      $('cb-show').innerHTML='<div style="color:var(--green);font-size:20px">✅ صحيح!</div>';
      $('cb-pad').style.display='none'; input=[];
      setTimeout(nextRound,800);
    } else {
      lives--;
      $('cb-l').textContent='❤️'.repeat(Math.max(0,lives));
      $('cb-show').innerHTML=`<div style="color:var(--red);font-size:18px">❌ الصواب: ${seq.join('-')}</div>`;
      $('cb-pad').style.display='none'; input=[];
      if(lives<=0){ gameLose('نفدت حياتك!',cfg); return; }
      setTimeout(nextRound,1000);
    }
  }

  nextRound();
}

/* CHART ORACLE */
function startOracle(cfg){
  const body=$('game-body');
  let rounds=0,maxR=8,correct=0;
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:12px">
      <span>السؤال: <strong id="co-q">1/${maxR}</strong></span>
      <span>صحيح: <strong id="co-c" class="gold">0</strong></span>
    </div>
    <div style="height:120px;margin-bottom:10px"><canvas id="oc"></canvas></div>
    <div style="height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-bottom:12px">
      <div id="oc-tmr" style="height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));border-radius:3px;width:100%;transition:width 5s linear"></div>
    </div>
    <div class="two-col" style="gap:10px">
      <button class="btn btn-green btn-full" onclick="oracleAns('up')"><i class="fas fa-arrow-trend-up"></i> ارتفاع</button>
      <button class="btn btn-red btn-full" onclick="oracleAns('down')"><i class="fas fa-arrow-trend-down"></i> انخفاض</button>
    </div>
    <div id="oc-res" style="text-align:center;margin-top:10px;font-size:13px;font-weight:700;min-height:20px"></div>`;

  let prices=[],nextP=0,correctDir='',answered=false,oChart=null;

  window.oracleAns=function(dir){
    if(answered) return;
    answered=true;
    clearTimeout(activeGame._ot);
    document.getElementById('oc-tmr').style.transition='none';
    const ok=dir===correctDir;
    if(ok) correct++;
    $('co-c').textContent=correct;
    document.getElementById('oc-res').innerHTML=ok?
      `<span class="green">✅ صحيح! → ${nextP.toFixed(2)}</span>`:
      `<span class="red">❌ الصواب: ${correctDir==='up'?'ارتفاع':'انخفاض'} → ${nextP.toFixed(2)}</span>`;
    if(oChart){ oChart.data.datasets[0].data=[...prices,nextP]; oChart.update('none'); }
    setTimeout(nextRound,1100);
  };

  function nextRound(){
    if(rounds>=maxR){
      const pct=(correct/maxR)*100;
      if(correct>=Math.ceil(maxR*.55)) gameWin(pct,cfg);
      else gameLose(`${correct}/${maxR} صحيح`,cfg);
      return;
    }
    rounds++;
    answered=false;
    $('co-q').textContent=`${rounds}/${maxR}`;
    document.getElementById('oc-res').textContent='';
    prices=[100];
    for(let i=1;i<20;i++) prices.push(+(prices[i-1]+(Math.random()-.5)*7).toFixed(2));
    nextP=+(prices[prices.length-1]+(Math.random()-.5)*10).toFixed(2);
    correctDir=nextP>prices[prices.length-1]?'up':'down';
    drawOChart(prices);
    const tmr=document.getElementById('oc-tmr');
    if(tmr){ tmr.style.transition='none'; tmr.style.width='100%'; setTimeout(()=>{ tmr.style.transition='width 5s linear'; tmr.style.width='0%'; },50); }
    activeGame._ot=setTimeout(()=>{
      if(!answered) window.oracleAns('__timeout__');
    },5100);
  }

  function drawOChart(data){
    const canvas=$('oc'); if(!canvas) return;
    if(oChart){ oChart.destroy(); }
    const up=data[data.length-1]>=data[0];
    oChart=new Chart(canvas,{type:'line',data:{labels:data.map((_,i)=>i+1),datasets:[{data,borderColor:up?'#00FF88':'#FF4757',borderWidth:2,pointRadius:0,tension:.4,fill:true,backgroundColor:up?'rgba(0,255,136,.05)':'rgba(255,71,87,.05)'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}},animation:{duration:200}}});
  }

  nextRound();
}

/* REKT MINER */
function startMiner(cfg){
  const body=$('game-body');
  const TOTAL=15,TIME=20;
  let rocksLeft=TOTAL,timeLeft=TIME,hp=0,maxHp=0;
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:12px">
      <span>⏱ <strong id="rm-t" class="red">${TIME}</strong>ث</span>
      <span>صخور: <strong id="rm-r" class="gold">${TOTAL}</strong></span>
    </div>
    <div style="min-height:180px;display:flex;align-items:center;justify-content:center" id="rock-zone"></div>
    <div class="small muted" style="text-align:center;margin-top:8px">اضغط على الصخرة!</div>`;

  gameTimer=setInterval(()=>{
    timeLeft--;
    const tl=$('rm-t'); if(tl) tl.textContent=timeLeft;
    if(timeLeft<=0){ clearInterval(gameTimer); gameLose(`دمّرت ${TOTAL-rocksLeft}/${TOTAL}`,cfg); }
  },1000);

  function spawnRock(){
    const zone=$('rock-zone'); if(!zone) return;
    const lvl=Math.min(5,Math.ceil((TOTAL-rocksLeft+1)/3));
    maxHp=lvl; hp=lvl;
    const sz=[80,100,120,140,160][lvl-1];
    zone.innerHTML=`
      <div class="rock" id="ar" style="width:${sz}px;height:${sz}px;font-size:${sz*.55}px;background:rgba(${80-lvl*10},${60-lvl*8},${40},0.2);border:2px solid rgba(120,80,40,${0.3+lvl*.08})">
        <div class="rock-hpb"><div class="rock-hpf" id="rhpf" style="width:100%"></div></div>
        <i class="fas fa-mountain"></i>
        <div style="position:absolute;bottom:6px;font-size:10px;font-weight:700">${hp}/${maxHp}</div>
      </div>`;
    document.getElementById('ar').addEventListener('click',function(e){
      hp--;
      this.style.transform='scale(.92)';
      setTimeout(()=>{ if(this) this.style.transform=''; },120);
      const f=$('rhpf'); if(f) f.style.width=(hp/maxHp*100)+'%';
      // particles
      for(let i=0;i<3;i++){
        const p=document.createElement('div');
        p.className='ptcl';
        p.style.left=e.clientX+'px'; p.style.top=e.clientY+'px';
        p.style.setProperty('--dx',(Math.random()-.5)*50+'px');
        p.style.setProperty('--dy',-(20+Math.random()*45)+'px');
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),600);
      }
      if(hp<=0){
        rocksLeft--;
        const rr=$('rm-r'); if(rr) rr.textContent=rocksLeft;
        if(rocksLeft<=0){ clearInterval(gameTimer); const sc=Math.round(timeLeft/TIME*100); gameWin(sc,cfg); return; }
        zone.innerHTML='<div style="font-size:44px;animation:bounceIn .3s">💥</div>';
        setTimeout(spawnRock,350);
      }
    });
  }
  spawnRock();
}

/* WHALE HUNT */
function startWhale(cfg){
  const body=$('game-body');
  const TIME=15,NEED=10;
  let caught=0,missed=0,tLeft=TIME,spawnTimer=null;
  body.innerHTML=`
    <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px">
      <span>⏱ <strong id="wh-t" class="red">${TIME}</strong>ث</span>
      <span>🐋 <strong id="wh-c" class="gold">0</strong>/${NEED}</span>
    </div>
    <div class="ocean" id="ocean"></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px">
      <span>فاتك: <span id="wh-m" class="red">0</span></span>
      <span>اضغط على الحيتان!</span>
    </div>`;

  gameTimer=setInterval(()=>{
    tLeft--;
    const t=$('wh-t'); if(t) t.textContent=tLeft;
    if(tLeft<=0){ clearTimeout(spawnTimer); endWhale(); }
  },1000);

  const WHALES=[
    {e:'🐋',pts:1,dur:2200,sz:56},{e:'🐬',pts:2,dur:1600,sz:44},
    {e:'🦈',pts:3,dur:1100,sz:50},{e:'💎',pts:5,dur:800,sz:36},
  ];

  function spawn(){
    const ocean=$('ocean'); if(!ocean) return;
    const w=WHALES[Math.floor(Math.random()*WHALES.length)];
    const el=document.createElement('div');
    el.className='whale';
    el.innerHTML=w.e;
    el.style.cssText=`left:${5+Math.random()*80}%;top:${5+Math.random()*70}%;width:${w.sz}px;height:${w.sz}px;font-size:${w.sz*.6}px;animation-duration:${w.dur}ms`;
    ocean.appendChild(el);
    el.addEventListener('click',()=>{
      caught+=w.pts;
      el.style.transform='scale(1.4)'; el.style.opacity='0'; el.style.transition='.25s';
      setTimeout(()=>el.remove(),260);
      const wc=$('wh-c'); if(wc) wc.textContent=caught;
      if(caught>=NEED){ clearTimeout(spawnTimer); clearInterval(gameTimer); gameWin(100,cfg); }
    });
    const tid=setTimeout(()=>{
      el.remove(); missed++;
      const wm=$('wh-m'); if(wm) wm.textContent=missed;
    },w.dur);
    el._tid=tid;
    const delay=Math.max(450,1300-caught*60);
    spawnTimer=setTimeout(spawn,delay);
  }

  function endWhale(){
    clearTimeout(spawnTimer);
    const pct=Math.round(caught/NEED*100);
    if(caught>=NEED) gameWin(100,cfg);
    else if(pct>=50) gameWin(pct,cfg);
    else gameLose(`اصطدت ${caught}/${NEED}`,cfg);
  }

  spawn();
}

function getGambleBet(){
  const v=parseInt($('gamble-bet')?.value||'0');
  if(!v||v<10){ toast('الحد الأدنى 10 Quinn','e'); return null; }
  if(v>S.tokens){ toast('رصيد غير كافٍ','e'); return null; }
  return v;
}

async function startGamble(){
  const bet=getGambleBet(); if(!bet) return;
  S.tokens-=bet; $('hdr-bal').textContent=fmt(S.tokens);
  markDirty();

  const res=$('gamble-result');
  res.innerHTML='<div style="text-align:center;color:var(--cyan);padding:12px"><i class="fas fa-spinner fa-spin"></i> البحث عن منافس...</div>';

  // PvP via RTDB
  const lobbyRef=rtdb.ref('gambling/lobby');
  const snap=await lobbyRef.once('value');
  const waiting=snap.val();

  if(waiting && waiting.uid!==S.uid){
    // Found opponent
    const total=bet+(waiting.bet||0);
    await lobbyRef.remove();
    const myDie=Math.floor(Math.random()*6)+1;
    const oppDie=Math.floor(Math.random()*6)+1;
    showGambleResult(myDie,oppDie,waiting.name||'خصم',bet,total);
  } else {
    // Wait
    await lobbyRef.set({uid:S.uid,name:S.name,bet,ts:Date.now()});
    res.innerHTML=`<div style="text-align:center;color:var(--cyan);padding:12px"><i class="fas fa-spinner fa-spin"></i> في انتظار خصم...<br><span class="small muted">سيتم المطابقة خلال 10 ثوان</span></div>`;

    setTimeout(async()=>{
      const s2=await rtdb.ref('gambling/lobby').once('value');
      if(s2.val()?.uid===S.uid){
        await rtdb.ref('gambling/lobby').remove();
        // Simulate bot
        const myDie=Math.floor(Math.random()*6)+1;
        const botDie=Math.floor(Math.random()*6)+1;
        showGambleResult(myDie,botDie,'Quinn AI',bet,bet*2,true);
      }
    },10000);
  }
}

function startGambleAI(){
  const bet=getGambleBet(); if(!bet) return;
  S.tokens-=bet; $('hdr-bal').textContent=fmt(S.tokens);
  markDirty();
  setTimeout(()=>{
    const myDie=Math.floor(Math.random()*6)+1;
    let aiDie=Math.floor(Math.random()*6)+1;
    // RTP 95%: occasionally nudge AI higher
    const sessionRTP=S._sessionWin/(S._sessionBet||1);
    if(sessionRTP>0.95 && Math.random()<0.65) aiDie=Math.min(6,aiDie+1+Math.floor(Math.random()*2));
    showGambleResult(myDie,aiDie,'Quinn AI',bet,bet*2,true);
  },1200);
}

function showGambleResult(myDie,oppDie,oppName,myBet,totalPot,isAI=false){
  const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  const won=myDie>oppDie, tied=myDie===oppDie;
  const res=$('gamble-result'); if(!res) return;

  if(won){
    S.tokens+=totalPot;
    S._sessionWin=(S._sessionWin||0)+(totalPot-myBet);
    addTx('gamble_win',totalPot-myBet);
  } else if(tied){
    S.tokens+=myBet;
    addTx('gamble_win',0);
  } else {
    S._sessionBet=(S._sessionBet||0)+myBet;
    addTx('gamble_lose',myBet);
  }
  markDirty();
  $('hdr-bal').textContent=fmt(S.tokens);

  res.innerHTML=`
    <div class="gc" style="padding:16px;text-align:center">
      <div style="display:flex;align-items:center;justify-content:space-around;margin-bottom:14px">
        <div>
          <div class="small muted">${S.name.substr(0,10)}</div>
          <div class="die" style="margin:8px auto">${faces[myDie-1]}</div>
          <div style="font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--gold)">${myDie}</div>
        </div>
        <div class="small" style="color:var(--muted)">VS</div>
        <div>
          <div class="small muted">${oppName.substr(0,10)}</div>
          <div class="die" style="margin:8px auto">${faces[oppDie-1]}</div>
          <div style="font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--gold)">${oppDie}</div>
        </div>
      </div>
      <div style="font-size:18px;font-weight:900;${won?'color:var(--green)':tied?'color:var(--gold)':'color:var(--red)'};margin-bottom:6px">
        ${won?`🏆 فزت! +${fmt(totalPot-myBet)}`:tied?'🤝 تعادل!':'💔 خسرت!'}
      </div>
      <div class="small muted">الرهان: ${fmt(myBet)} | الإجمالي: ${fmt(totalPot)}</div>
    </div>`;
}

function checkVaultRewards(){
  if(!S.vaultStaked||S.vaultStaked<=0) return;
  const loyaltyMul=Math.min(1.25,S.vaultLoyaltyMul||1);
  const dailyRate=BASE_YIELD*loyaltyMul;
  const pendingMs=Date.now()-(S.vaultLastClaim||Date.now());
  if(pendingMs<60*1000) return;
  const reward=Math.floor(S.vaultStaked*dailyRate*(pendingMs/(24*60*60*1000)));
  if(reward>0){
    S.tokens+=reward; S.totalTokens+=reward;
    S.vaultLastClaim=Date.now();
    addTx('vault_rw',reward);
    markDirty();
    $('hdr-bal').textContent=fmt(S.tokens);
    toast(`🏦 Vault: +${fmt(reward)} Quinn`,'s');
  }
}

function execDeposit(){
  const amt=parseInt($('vd-amt')?.value||'0');
  if(!amt||amt<1000){ toast('الحد الأدنى 1000 Quinn','e'); return; }
  if(amt>S.tokens){ toast('رصيد غير كافٍ','e'); return; }
  S.tokens-=amt;
  S.vaultStaked=(S.vaultStaked||0)+amt;
  S.vaultLastDeposit=Date.now();
  if(!S.vaultLastClaim) S.vaultLastClaim=Date.now();
  addTx('vault_dep',amt);
  markDirty();
  closeModal('vault-dep-modal');
  $('hdr-bal').textContent=fmt(S.tokens);
  toast(`✅ تم إيداع ${fmt(amt)} Quinn في Vault`,'s');
  renderTab('vault');
}

function execWithdraw(){
  if(!S.vaultStaked||S.vaultStaked<=0){ toast('لا يوجد رصيد مودع','e'); return; }
  const isLocked=(Date.now()-(S.vaultLastDeposit||Date.now()))<VAULT_LOCK_MS;
  let amt=S.vaultStaked;
  if(isLocked){ amt=Math.floor(amt*0.9); toast(`⚠️ عقوبة سحب مبكر: تلقيت ${fmt(amt)} فقط`,'w'); }
  S.tokens+=amt;
  addTx('vault_wd',amt);
  S.vaultStaked=0; S.vaultLastDeposit=0;
  markDirty();
  $('hdr-bal').textContent=fmt(S.tokens);
  toast(`✅ تم سحب ${fmt(amt)} Quinn`,'s');
  renderTab('vault');
}

function execClaim(){
  if(!S.vaultStaked||S.vaultStaked<=0){ toast('لا يوجد مودع','e'); return; }
  const loyaltyMul=Math.min(1.25,S.vaultLoyaltyMul||1);
  const dailyRate=BASE_YIELD*loyaltyMul;
  const pendingMs=Date.now()-(S.vaultLastClaim||Date.now());
  const pending=Math.floor(S.vaultStaked*dailyRate*(pendingMs/(24*60*60*1000)));
  if(pending<=0){ toast('لا توجد مكافأة بعد','w'); return; }
  S.tokens+=pending; S.totalTokens+=pending;
  S.vaultLastClaim=Date.now();
  addTx('vault_rw',pending);
  markDirty();
  $('hdr-bal').textContent=fmt(S.tokens);
  toast(`🎁 حصلت على ${fmt(pending)} Quinn من Vault!`,'s');
  renderTab('vault');
}

let _notifs=[];

function startNotifListener(){
  db.collection('notifications').orderBy('timestamp','desc').limit(5).onSnapshot(snap=>{
    let isFirst=true;
    snap.docChanges().forEach(ch=>{
      if(ch.type==='added'){
        const d=ch.doc.data();
        _notifs.unshift({msg:d.message,time:d.timestamp?.toDate?.()?.toLocaleString?.('ar-SA')||'الآن'});
        if(!isFirst){ toast(`🔔 ${d.message}`,'i'); $('notif-dot').style.display='block'; }
        isFirst=false;
      }
    });
  });
}

async function handleReferral(refId){
  if(S.referredBy||String(S.uid)===String(refId)) return;
  try{
    S.referredBy=refId;
    S.tokens+=1000; S.totalTokens+=1000;
    addTx('referral',1000,{from:refId});
    markDirty();
    await db.collection('users').doc(String(refId)).update({
      referrals:firebase.firestore.FieldValue.increment(1),
      tokens:firebase.firestore.FieldValue.increment(5000),
      totalTokens:firebase.firestore.FieldValue.increment(5000),
    });
    toast('🎁 حصلت على 1000 Quinn كمكافأة إحالة!','s');
  }catch(e){ console.warn('[Referral]',e); }
}

/* Send */
async function execSend(){
  const to=$('send-to')?.value?.trim();
  const amt=parseInt($('send-amt')?.value||'0');
  if(!to||!to.startsWith('QN-')){ toast('معرف غير صحيح','e'); return; }
  if(!amt||amt<1){ toast('أدخل كمية صحيحة','e'); return; }
  if(amt>S.tokens){ toast('رصيد غير كافٍ','e'); return; }
  S.tokens-=amt;
  addTx('send',amt,{to});
  markDirty();
  // Find receiver and credit
  try{
    const snap=await db.collection('users').where('walletId','==',to).limit(1).get();
    if(!snap.empty){
      const rdoc=snap.docs[0];
      await rdoc.ref.update({tokens:firebase.firestore.FieldValue.increment(amt),totalTokens:firebase.firestore.FieldValue.increment(amt)});
    }
  }catch(_){}
  Q.closeModal('send-modal');
  $('hdr-bal').textContent=fmt(S.tokens);
  toast(`✅ أُرسل ${fmt(amt)} Quinn`,'s');
  if(curTab==='wallet') renderTab('wallet');
}
